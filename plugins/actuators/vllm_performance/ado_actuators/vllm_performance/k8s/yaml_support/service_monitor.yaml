apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: PLACEHOLDER_K8S_NAME
  namespace: PLACEHOLDER_NAMESPACE
  labels:
    app: PLACEHOLDER_K8S_NAME
spec:
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: PLACEHOLDER_K8S_NAME
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http

